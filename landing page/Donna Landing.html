<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donna — your academic chief of staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Donna brand tokens — matched to live site */
    --bg: #F4F7F8;          /* soft mist */
    --bg-deep: #eaeff1;     /* surface-container */
    --paper: #FDFDFD;       /* surface white */
    --ink: #1A1C1E;         /* primary dark */
    --ink-2: #44474E;       /* secondary text */
    --ink-3: #74777F;       /* tertiary / outline */
    --line: #1A1C1E10;
    --line-2: #C4C7CF;
    --accent: #466270;      /* app primary blue-grey */
    --accent-2: #78909C;    /* landing accent */
    --accent-soft: #c9e7f7; /* primary-container */
    --good: #4d8a6e;
    --warn: #9f403d;
    --display: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
  }
  ::selection { background: var(--accent); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: 0; color: inherit; }
  h1, h2, h3, h4 { margin: 0; font-weight: 400; letter-spacing: -0.01em; }
  p { margin: 0; }
  .serif { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; }
  .mono { font-family: var(--mono); font-feature-settings: "ss01"; }
  .container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .container { padding: 0 20px; } }

  /* ===== Top nav ===== */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease, background .3s ease;
  }
  .nav.scrolled { border-color: var(--line-2); }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.02em; font-size: 19px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--ink); position: relative;
    display: grid; place-items: center;
  }
  .brand-mark::after {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent-2);
  }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--ink-2); }
  .nav-links a:hover { color: var(--ink); }
  @media (max-width: 720px) { .nav-links { display: none; } }
  .nav-cta { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .nav-signin { color: var(--ink-2); }
  .nav-signin:hover { color: var(--ink); }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--ink); color: var(--paper);
    box-shadow: 0 1px 0 0 #fff2 inset, 0 8px 24px -10px #16141066;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 1px 0 0 #fff2 inset, 0 14px 28px -10px #16141088; }
  .btn-ghost { color: var(--ink); border: 1px solid var(--line-2); background: var(--paper); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-link { padding: 6px 0; gap: 6px; color: var(--ink); border-bottom: 1px solid var(--ink); border-radius: 0; }
  .btn-arrow {
    width: 22px; height: 22px; border-radius: 50%;
    background: color-mix(in oklab, var(--paper) 80%, transparent);
    display: inline-grid; place-items: center;
    transition: transform .2s ease;
  }
  .btn:hover .btn-arrow { transform: translateX(2px); }

  /* ===== Hero ===== */
  .hero {
    padding: 64px 0 96px;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 64px;
    align-items: center;
  }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 12px 6px 8px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line-2);
    font-size: 13px; color: var(--ink-2);
    margin-bottom: 28px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px color-mix(in oklab, var(--good) 25%, transparent); }
  .hero h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(48px, 7vw, 92px);
    line-height: 1.0;
    letter-spacing: -0.035em;
    margin-bottom: 28px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); font-weight: 700; }
  .hero-sub {
    font-size: 19px;
    color: var(--ink-2);
    max-width: 520px;
    margin-bottom: 36px;
    line-height: 1.5;
  }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .hero-meta {
    margin-top: 32px;
    display: flex; gap: 24px;
    font-size: 13px; color: var(--ink-3);
    flex-wrap: wrap;
  }
  .hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
  .hero-meta svg { width: 14px; height: 14px; }

  /* ===== Hero product card ===== */
  .product {
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 20px;
    box-shadow:
      0 1px 0 0 #fff8 inset,
      0 30px 60px -30px #16141033,
      0 8px 16px -8px #16141014;
    overflow: hidden;
    position: relative;
  }
  .product-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #00000005, transparent);
  }
  .product-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: #d8d2c5; }
  .product-bar .title {
    margin-left: 12px; font-size: 12px; color: var(--ink-3);
    font-family: var(--mono);
  }
  .product-body { padding: 22px; }

  /* Donna chat panel */
  .donna-row {
    display: flex; gap: 12px; align-items: flex-start;
    margin-bottom: 18px;
  }
  .donna-avatar {
    flex: 0 0 auto;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); display: grid; place-items: center;
    color: var(--paper); font-family: var(--display); font-weight: 700; font-size: 14px;
  }
  .donna-bubble {
    background: var(--bg-deep);
    padding: 12px 14px; border-radius: 12px 12px 12px 4px;
    font-size: 14px; line-height: 1.5; color: var(--ink);
    max-width: 85%;
  }
  .donna-bubble b { font-weight: 600; }

  .blocks {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 14px; margin-left: 44px;
  }
  .block {
    display: grid; grid-template-columns: 64px 1fr auto;
    gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 10px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .block .time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .block .label { font-weight: 500; color: var(--ink); }
  .block .label small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12px; margin-top: 1px; }
  .block .tag {
    font-size: 11px; font-family: var(--mono);
    padding: 3px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .block.deep { border-left: 3px solid var(--accent); }

  .approve-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding: 12px 14px;
    background: var(--ink); color: var(--paper);
    border-radius: 12px;
    font-size: 13px;
  }
  .approve-row .pulse { display: inline-flex; align-items: center; gap: 8px; }
  .approve-row .pulse .d { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .approve-actions { display: flex; gap: 8px; }
  .mini-btn {
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    background: #ffffff14; color: var(--paper); border: 1px solid #ffffff22;
  }
  .mini-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Floating cards around hero */
  .float-card {
    position: absolute; background: var(--paper);
    border: 1px solid var(--line-2); border-radius: 12px;
    padding: 12px 14px; font-size: 12px;
    box-shadow: 0 12px 30px -16px #16141040;
    pointer-events: none;
  }
  .float-1 { top: -18px; right: -22px; transform: rotate(3deg); }
  .float-2 { bottom: -16px; left: -28px; transform: rotate(-3deg); }
  .float-card .k { color: var(--ink-3); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .float-card .v { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }

  /* ===== Generic section ===== */
  section { position: relative; }
  .section-pad { padding: 120px 0; }
  @media (max-width: 720px) { .section-pad { padding: 80px 0; } }
  .section-head { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 56px; flex-wrap: wrap; }
  .kicker { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .kicker::before { content: ""; width: 18px; height: 1px; background: var(--ink-3); }
  .h2 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; max-width: 18ch; }
  .h2 em { font-style: normal; color: var(--accent); font-weight: 700; }
  .section-blurb { font-size: 17px; color: var(--ink-2); max-width: 38ch; }

  /* ===== Problem -> Solution ===== */
  .ps {
    background: var(--ink);
    color: var(--paper);
    border-radius: 32px;
    margin: 0 32px;
    padding: 96px 0;
    position: relative;
    overflow: hidden;
  }
  @media (max-width: 720px) { .ps { margin: 0 12px; padding: 64px 0; border-radius: 22px; } }
  .ps .container { max-width: 1180px; }
  .ps .kicker { color: #faf8f399; }
  .ps .kicker::before { background: #faf8f366; }
  .ps h2 { color: var(--paper); }
  .ps-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    margin-top: 56px;
  }
  @media (max-width: 820px) { .ps-grid { grid-template-columns: 1fr; gap: 24px; } }
  .ps-col {
    background: #ffffff08;
    border: 1px solid #ffffff14;
    border-radius: 18px;
    padding: 28px;
  }
  .ps-col.solution { background: var(--paper); color: var(--ink); border-color: transparent; }
  .ps-col h3 {
    font-family: var(--display); font-weight: 700; font-size: 26px; margin-bottom: 18px;
    letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .ps-col.solution h3 em { color: var(--accent); font-style: normal; }
  .ps-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .ps-col li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; border-top: 1px solid #ffffff14;
    font-size: 15px;
  }
  .ps-col.solution li { border-top-color: var(--line); }
  .ps-col li:first-child { border-top: 0; }
  .ps-col .ico {
    flex: 0 0 auto;
    width: 18px; height: 18px; margin-top: 2px;
    color: #faf8f377;
  }
  .ps-col.solution .ico { color: var(--accent); }
  .ps-col li b { display: block; font-weight: 500; margin-bottom: 2px; color: inherit; }
  .ps-col li span { color: #faf8f399; font-size: 14px; }
  .ps-col.solution li span { color: var(--ink-3); }

  /* ===== Feature grid ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
  }
  @media (max-width: 980px) { .features { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .features { grid-template-columns: 1fr; } }
  .feat {
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 18px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    min-height: 280px;
    display: flex; flex-direction: column;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .feat:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -22px #16141033; }
  .feat-1 { grid-column: span 4; }
  .feat-2 { grid-column: span 2; }
  .feat-3 { grid-column: span 2; }
  .feat-4 { grid-column: span 2; }
  .feat-5 { grid-column: span 2; }
  @media (max-width: 980px) {
    .feat-1, .feat-2, .feat-3, .feat-4, .feat-5 { grid-column: span 1; }
  }
  .feat .feat-num { position: absolute; top: 18px; right: 22px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .feat h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin-bottom: 8px; line-height: 1.15; letter-spacing: -0.02em; }
  .feat p { color: var(--ink-3); font-size: 14px; max-width: 32ch; }
  .feat-art { margin-top: auto; padding-top: 24px; }

  /* feat-1 mini calendar */
  .mini-cal {
    display: grid; grid-template-columns: 40px repeat(5, 1fr); gap: 4px;
    font-family: var(--mono); font-size: 10px;
    background: var(--bg-deep); border-radius: 10px; padding: 8px;
  }
  .mini-cal .h { color: var(--ink-3); padding: 4px 6px; text-align: center; }
  .mini-cal .h:first-child { text-align: right; }
  .mini-cal .row-time { color: var(--ink-3); padding: 6px; text-align: right; align-self: center; }
  .mini-cal .cell { background: #fff; border-radius: 4px; min-height: 22px; }
  .mini-cal .cell.donna { background: var(--accent-2); }
  .mini-cal .cell.class { background: #16141022; }
  .mini-cal .cell.merge2 { grid-row: span 2; }
  .mini-cal .cell.merge3 { grid-row: span 3; }

  /* feat-2 approval */
  .approve-mini {
    background: var(--ink); color: var(--paper); border-radius: 10px;
    padding: 12px; font-size: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .approve-mini .req { display: flex; gap: 8px; align-items: center; }
  .approve-mini .req .d { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .approve-mini .actions { display: flex; gap: 6px; }
  .approve-mini .actions button { font-size: 11px; padding: 4px 8px; border-radius: 6px; flex: 1; }
  .approve-mini .ok { background: var(--accent); color: #fff; }
  .approve-mini .no { background: #ffffff10; color: var(--paper); border: 1px solid #ffffff20; }

  /* feat-3 goals progress */
  .goals { display: flex; flex-direction: column; gap: 10px; }
  .goal-row { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
  .goal-row .top { display: flex; justify-content: space-between; color: var(--ink-2); }
  .goal-row .top b { font-weight: 500; }
  .goal-row .top .pct { font-family: var(--mono); color: var(--ink-3); }
  .goal-bar { height: 4px; background: var(--bg-deep); border-radius: 999px; overflow: hidden; }
  .goal-bar .fill { height: 100%; background: var(--ink); border-radius: 999px; }
  .goal-bar .fill.accent { background: var(--accent); }

  /* feat-4 history */
  .hist { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 11px; }
  .hist-row { display: grid; grid-template-columns: 50px 1fr auto; gap: 8px; padding: 6px 8px; background: var(--bg-deep); border-radius: 6px; align-items: center; color: var(--ink-2); }
  .hist-row .t { color: var(--ink-3); }
  .hist-row .s { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #fff; color: var(--ink-3); border: 1px solid var(--line); }
  .hist-row .s.ok { color: var(--good); border-color: color-mix(in oklab, var(--good) 30%, transparent); }
  .hist-row .s.app { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

  /* feat-5 nudge */
  .nudge {
    background: var(--bg-deep); border-radius: 10px; padding: 12px;
    font-size: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .nudge .from { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ===== How it works ===== */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line-2); }
  @media (max-width: 820px) { .steps { grid-template-columns: 1fr; } }
  .step {
    padding: 36px 32px 36px 0;
    border-right: 1px solid var(--line-2);
    position: relative;
  }
  .step:last-child { border-right: 0; padding-right: 0; }
  @media (max-width: 820px) {
    .step { border-right: 0; border-bottom: 1px solid var(--line-2); padding: 32px 0; }
    .step:last-child { border-bottom: 0; }
  }
  .step-num {
    font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1;
    color: var(--accent); margin-bottom: 16px;
    letter-spacing: -0.04em;
  }
  .step h3 { font-family: var(--display); font-weight: 700; font-size: 24px; margin-bottom: 8px; letter-spacing: -0.02em; }
  .step p { color: var(--ink-3); font-size: 15px; max-width: 28ch; }

  /* ===== Product preview ===== */
  .preview {
    background: var(--bg-deep);
    padding: 96px 0;
  }
  .preview-frame {
    margin-top: 56px;
    background: var(--paper);
    border-radius: 20px;
    border: 1px solid var(--line-2);
    box-shadow: 0 50px 80px -40px #16141040, 0 1px 0 0 #fff8 inset;
    overflow: hidden;
  }
  .pf-bar {
    display: flex; align-items: center; padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    gap: 14px;
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  }
  .pf-bar .dots { display: flex; gap: 6px; }
  .pf-bar .dots span { width: 10px; height: 10px; border-radius: 50%; background: #d8d2c5; }
  .pf-tabs { display: flex; gap: 4px; margin-left: 12px; }
  .pf-tab {
    padding: 6px 12px; border-radius: 8px; font-size: 12px;
    color: var(--ink-3);
    transition: all .15s ease;
  }
  .pf-tab.active { background: var(--bg); color: var(--ink); }
  .pf-tab:hover:not(.active) { color: var(--ink); }
  .pf-body { display: grid; grid-template-columns: 220px 1fr 320px; min-height: 540px; }
  @media (max-width: 980px) { .pf-body { grid-template-columns: 1fr; } .pf-body .pf-side, .pf-body .pf-right { display: none; } }
  .pf-side { border-right: 1px solid var(--line); padding: 20px 16px; font-size: 13px; }
  .pf-side .label { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 8px 8px; }
  .pf-side .label:first-child { margin-top: 0; }
  .pf-side .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); cursor: pointer; }
  .pf-side .item:hover { background: var(--bg); color: var(--ink); }
  .pf-side .item.active { background: var(--ink); color: var(--paper); }
  .pf-side .item .b { width: 18px; text-align: center; font-family: var(--mono); font-size: 11px; opacity: 0.7; }
  .pf-side .item .count { margin-left: auto; font-family: var(--mono); font-size: 11px; opacity: 0.7; }
  .pf-main { padding: 28px; overflow: hidden; }
  .pf-main h4 { font-family: var(--display); font-weight: 700; font-size: 28px; margin-bottom: 4px; letter-spacing: -0.025em; }
  .pf-main .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 24px; }
  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-item {
    display: grid; grid-template-columns: 70px 1fr auto;
    gap: 14px; align-items: center;
    padding: 14px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: all .15s ease;
    cursor: pointer;
  }
  .day-item:hover { border-color: var(--ink-2); }
  .day-item.donna { border-left: 3px solid var(--accent); }
  .day-item.class { background: var(--bg-deep); border-color: transparent; }
  .day-item .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .day-item .what { font-weight: 500; font-size: 14px; }
  .day-item .what small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .day-item .badge {
    font-family: var(--mono); font-size: 10px; padding: 4px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .day-item.class .badge { background: #16141014; color: var(--ink-3); }
  .day-item.done { opacity: 0.55; }
  .day-item.done .what { text-decoration: line-through; }

  .pf-right { border-left: 1px solid var(--line); padding: 20px; background: linear-gradient(180deg, var(--bg) 0%, var(--paper) 100%); }
  .pf-right .donna-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .pf-right .donna-head .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--paper); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px; }
  .pf-right .donna-head .who { font-size: 13px; }
  .pf-right .donna-head .who small { display: block; color: var(--ink-3); font-size: 11px; }
  .pf-msg { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .pf-msg .from { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .pf-prop {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; font-size: 13px;
  }
  .pf-prop .tag { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-bottom: 8px; }
  .pf-prop b { font-weight: 600; }
  .pf-prop .when { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
  .pf-prop .acts { display: flex; gap: 6px; margin-top: 12px; }
  .pf-prop .acts button { padding: 6px 10px; font-size: 12px; border-radius: 6px; flex: 1; transition: all .15s ease; }
  .pf-prop .acts .y { background: var(--ink); color: var(--paper); }
  .pf-prop .acts .y:hover { background: var(--accent); }
  .pf-prop .acts .n { background: #fff; color: var(--ink-2); border: 1px solid var(--line-2); }

  /* ===== Trust ===== */
  .trust-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  @media (max-width: 820px) { .trust-grid { grid-template-columns: 1fr; } }
  .trust-item {
    padding: 32px;
    border-right: 1px solid var(--line-2);
    border-top: 1px solid var(--line-2);
  }
  @media (max-width: 820px) {
    .trust-item { border-right: 0; }
  }
  .trust-item:nth-child(3n) { border-right: 0; }
  .trust-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 24px; }
  .trust-item h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin-bottom: 8px; letter-spacing: -0.02em; }
  .trust-item p { color: var(--ink-3); font-size: 14px; }

  /* ===== Final CTA ===== */
  .final {
    margin: 0 32px 32px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 32px;
    padding: 120px 64px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  @media (max-width: 720px) { .final { margin: 0 12px 12px; padding: 72px 24px; border-radius: 22px; } }
  .final .h2 { color: var(--paper); margin: 0 auto 20px; max-width: 18ch; font-size: clamp(40px, 6vw, 72px); }
  .final .h2 em { color: var(--accent); }
  .final p { color: #faf8f399; max-width: 50ch; margin: 0 auto 40px; font-size: 17px; }
  .final .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .final .btn-primary { background: var(--paper); color: var(--ink); }
  .final .btn-ghost { background: transparent; color: var(--paper); border-color: #ffffff33; }
  .final .btn-ghost:hover { border-color: var(--paper); }

  /* faint grid backdrop */
  .final::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 80%, color-mix(in srgb, var(--accent-2) 28%, transparent) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, #ffffff10 0%, transparent 50%);
    pointer-events: none;
  }

  /* ===== Footer ===== */
  footer { padding: 48px 0 36px; }
  .foot-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 32px; padding-bottom: 36px; border-bottom: 1px solid var(--line-2); }
  @media (max-width: 720px) { .foot-row { grid-template-columns: 1fr 1fr; } }
  .foot-col h5 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 14px; font-weight: 500; }
  .foot-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .foot-col a:hover { color: var(--accent); }
  .foot-tag { color: var(--ink-3); font-size: 14px; margin-top: 12px; max-width: 32ch; line-height: 1.5; }
  .foot-bottom { padding-top: 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-family: var(--mono); }

  /* ===== Reveal on scroll ===== */
  [data-reveal] { opacity: 0; transform: translateY(20px); transition: opacity .8s ease, transform .8s ease; }
  [data-reveal].in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-reveal] { opacity: 1; transform: none; }
  }

  /* light/dark theme toggle via tweaks */
  body.theme-night {
    --bg: #14181a;
    --bg-deep: #1b2023;
    --paper: #1f2528;
    --ink: #eef2f3;
    --ink-2: #c8cdd0;
    --ink-3: #8a9094;
    --line: #ffffff14;
    --line-2: #ffffff22;
    --accent-soft: #1f3340;
  }
  body.theme-night .ps { background: #0c1012; }
  body.theme-night .final { background: #0c1012; }
  body.theme-night .ps-col.solution { background: #2a3236; color: var(--ink); }
  body.theme-night .day-item { background: #2a3236; }
  body.theme-night .day-item.class { background: #1a2024; }
  body.theme-night .pf-side .item.active { background: var(--paper); color: var(--ink); border: 1px solid var(--line-2); }

  /* hue tweak — all derived from Donna's blue-grey family */
  body.hue-default { --accent: #466270; --accent-2: #78909C; --accent-soft: #c9e7f7; }
  body.hue-deep    { --accent: #2b3437; --accent-2: #466270; --accent-soft: #dbe4e7; }
  body.hue-tertiary{ --accent: #6d4ea3; --accent-2: #8b6dc0; --accent-soft: #e8dffa; }
  body.hue-warm    { --accent: #9f403d; --accent-2: #c46a67; --accent-soft: #fadcdc; }
</style>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
